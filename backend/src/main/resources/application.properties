spring.application.name=vehicle-rental

# ---------------------------------------------------------------------
#  Server
# ---------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------
#  MySQL connection
#  createDatabaseIfNotExist=true means Spring creates vehicle_rental_db
#  on first startup if it does not already exist.
#
#  ${NAME:default} reads an environment variable and falls back to the
#  value after the colon. The default password is EMPTY, which is how a
#  fresh Homebrew/XAMPP MySQL install ships.
#
#  If your MySQL root account does have a password, do NOT edit this file
#  - every member has a different password and editing it causes merge
#  conflicts. Set the variable instead:
#
#      export MYSQL_PASSWORD=yourpassword     (macOS / Linux)
#      set MYSQL_PASSWORD=yourpassword        (Windows cmd)
#
#  or run: mvn spring-boot:run -Dspring-boot.run.arguments=--spring.datasource.password=yourpassword
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
#  JPA / Hibernate
#  ddl-auto=update lets Hibernate create or alter tables to match the
#  entity classes. Handy while developing; see the note in the README
#  about switching to "validate" once the schema is stable.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
#  SQL logging - shows every statement Hibernate runs
#  show-sql prints the statement, format_sql indents it, and the
#  jdbc.bind logger prints the actual "?" parameter values.
# ---------------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------------------------------------------------------------------
#  Vehicle photo uploads
#  Files are written to backend/uploads/ and served at /uploads/<name>.
# ---------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
