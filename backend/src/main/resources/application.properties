spring.application.name=vehicle-rental

# ---------------------------------------------------------------------
#  Server
# ---------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------
#  MySQL connection
#  createDatabaseIfNotExist=true means Spring creates vehicle_rental_db
#  on first startup if it does not already exist.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
#  JPA / Hibernate
#  ddl-auto=update lets Hibernate create or alter tables to match the
#  entity classes. Handy while developing; see the note in the README
#  about switching to "validate" once the schema is stable.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
#  SQL logging - shows every statement Hibernate runs
#  show-sql prints the statement, format_sql indents it, and the
#  jdbc.bind logger prints the actual "?" parameter values.
# ---------------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
